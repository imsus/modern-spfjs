name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check, test, build, docs, publish-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format + lint + typecheck)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build

      - name: Publish checks (publint + arethetypeswrong)
        run: pnpm check:publish
