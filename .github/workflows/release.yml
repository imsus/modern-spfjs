name: Release

# Publishes a new version when a commit lands on main.
#
# npm publishing uses **trusted publishing (OIDC)** — no NPM_TOKEN. The
# npm-side contract must match this workflow exactly:
#   https://www.npmjs.com/package/@imsus/modern-spf → Settings → Trusted
#   Publisher → GitHub Actions → user `imsus`, repository `modern-spfjs`,
#   workflow filename `release.yml`, allowed action `npm publish`.
# (npm retired classic tokens Nov 2025; granular bypass-2FA tokens are
# discouraged for automation. Trusted publishing is the recommended path.)
#
# The GITHUB_TOKEN (automatic) is used for the GitHub release and the
# version-bump commit pushed by @semantic-release/git.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format + lint + typecheck)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Publish checks (refuse to release a broken package)
        run: pnpm check:publish

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
